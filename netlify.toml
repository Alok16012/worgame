[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/api/aquasms/*"
  to = "https://login.aquasms.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
